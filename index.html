<!doctype html>
<html lang="id" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="page/shared.css" />
    <link rel="stylesheet" href="fontawesome/css/fontawesome.css" />
    <link rel="stylesheet" href="fontawesome/css/duotone.css" />
    <link rel="stylesheet" href="fontawesome/css/regular.css" />
    <link rel="manifest" href="manifest.json" />
    <title>Tools Hub</title>
    <style>
      /* ── Topbar ── */
      .container {
        max-width: 1400px;
      }
      .topbar {
        margin-bottom: 20px;
      }
      .topbar-row {
        align-items: flex-start;
      }
      .subtitle {
        margin: 0;
      }
      .filter-status {
        text-align: right;
      }

      /* ── Search ── */
      .search-wrap {
        flex: 1;
        min-width: 0;
        position: relative;
      }
      .search-wrap .search-ico {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        width: 16px;
        height: 16px;
        color: var(--muted);
        pointer-events: none;
      }
      .search-wrap input {
        width: 100%;
        padding: 10px 14px 10px 36px;
        border-radius: 30px;
        border: 1px solid transparent;
        background: var(--card);
        color: var(--fg);
        font-size: 0.9rem;
        outline: none;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      .search-wrap input::placeholder {
        color: var(--muted);
      }
      .search-wrap input:focus {
        border-color: var(--primary);
      }

      /* ── Toolbar ── */
      .toolbar {
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .view-btn {
        width: 36px;
        height: 36px;
        padding: 0;
        border-radius: 30px;
        border: 1px solid transparent;
        background: var(--card);
        color: var(--muted);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition:
          background 0.15s,
          border-color 0.15s,
          color 0.15s;
      }
      .view-btn:hover {
        background: var(--accent);
        color: var(--fg);
      }
      .view-btn.active {
        border-color: var(--primary);
        color: var(--primary);
        background: color-mix(in srgb, var(--primary) 10%, transparent);
      }
      .view-btn i {
        display: block;
        font-size: 16px;
      }

      /* ── Grid / List ── */
      .grid {
        padding-bottom: 64px;
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      }
      .grid.list-view {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      /* ── Tool Card ── */
      .tool-card {
        position: relative;
        background: var(--card);
        border-radius: 30px;
        padding: 24px 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        text-decoration: none;
        color: var(--fg);
        transition:
          border-color 0.3s,
          box-shadow 0.3s;
        cursor: pointer;
        overflow: hidden;
        container-type: inline-size;
      }
      .tool-card::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 30px;
        background: color-mix(in srgb, var(--icon-bg) 10%, var(--card));
        transform: scale(0);
        transform-origin: 20px 24px;
        opacity: 0;
        transition: transform 0.4s cubic-bezier(0.25, 0.1, 0.25, 1), opacity 0.3s ease;
        z-index: 0;
      }
      .tool-card:hover::before {
        transform: scale(1);
        opacity: 1;
      }
      .tool-card:hover {
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      }
      .tool-card:active {
        transform: scale(0.98);
      }

      .tool-icon {
        width: 44px;
        height: 44px;
        border-radius: 30px;
        display: grid;
        place-items: center;
        flex-shrink: 0;
        position: relative;
        z-index: 1;
        background: color-mix(in srgb, var(--icon-bg) 15%, transparent);
        transition: all 0.35s cubic-bezier(0.25, 0.1, 0.25, 1);
        transform-origin: left center;
      }
      .tool-card:hover .tool-icon {
        transform: translateX(calc(10cqi - 40px)) translateY(25px) scale(1.4);
        background: transparent;
      }
      .tool-icon svg {
        width: 30px;
        height: 30px;
        pointer-events: none;
        transition: transform 0.35s cubic-bezier(0.25, 0.1, 0.25, 1);
      }
      .tool-card:hover .tool-icon svg {
        transform: scale(1.15);
      }
      .tool-icon svg text {
        font-family: inherit;
      }
      .tool-card .tool-text {
        display: flex;
        flex-direction: column;
        gap: 2px;
        position: relative;
        z-index: 1;
        transition: all 0.35s cubic-bezier(0.25, 0.1, 0.25, 1);
      }
      .tool-card:hover .tool-text {
        transform: translateX(50px) translateY(-28px);
      }

      /* ── List view card override ── */
      .grid.list-view .tool-card {
        flex-direction: row;
        align-items: center;
        gap: 16px;
        padding: 14px 20px;
        border-radius: 30px;
      }
      .grid.list-view .tool-card:hover {
        transform: none;
      }
      .grid.list-view .tool-icon {
        transform: none;
      }
      .grid.list-view .tool-text {
        flex: 1;
        transform: none;
      }
      .grid.list-view .tool-card h3 {
        font-size: 0.95rem;
      }
      .grid.list-view .tool-card p {
        font-size: 0.8rem;
      }

      .fav-btn {
        position: absolute;
        top: 8px;
        right: 8px;
        z-index: 1;
        width: 26px;
        height: 26px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: none;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        opacity: 0;
        transition:
          opacity 0.15s,
          color 0.15s,
          transform 0.15s;
      }
      .tool-card:hover .fav-btn,
      .fav-btn.fav {
        opacity: 1;
      }
      .fav-btn:hover {
        color: #fbbf24;
        transform: scale(1.15);
      }
      .fav-btn.fav {
        color: #fbbf24;
      }
      .fav-btn svg {
        display: block;
        width: 18px;
        height: 18px;
        pointer-events: none;
      }
      .tool-card h3 {
        font-size: 1rem;
        font-weight: 500;
        line-height: 1.3;
      }
      .tool-card p {
        font-size: 0.8rem;
        color: var(--muted);
        line-height: 1.45;
      }

      /* ── Topbar theme toggle glass pill ── */
      .topbar .theme-toggle {
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        gap: 0;
        background: var(--card);
        color: var(--fg);
        padding: 12px;
        border-radius: 30px;
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: var(--liquid-shadow);
        outline: none;
        transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
      }
      .topbar .theme-toggle:hover {
        color: var(--muted);
        background: color-mix(in srgb, var(--muted) 16%, transparent);
        transform: scale(1.02);
      }

      /* ── Empty State ── */
      .empty {
        display: none;
        text-align: center;
        padding: 48px 16px;
        color: var(--muted);
        font-size: 0.95rem;
      }
      .empty.show {
        display: block;
      }

      /* ── Animations ── */
      .tool-card {
        animation: card-in 0.3s ease backwards;
      }
      @keyframes card-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ── Responsive ── */
      @media (max-width: 480px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="navbar"></div>
    <div class="container view active">
      <div class="topbar" style="margin-bottom: 0px !important;">
        <div class="topbar-row">
          <div class="title-block">
            <h1>Tools Hub</h1>
            <p class="subtitle">Kumpulan tools berguna dalam satu tempat.</p>
          </div>
          <button class="theme-toggle" id="theme-toggle" aria-label="Ganti tema">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5" />
              <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" /></svg>
            <span id="theme-label">Mode Terang</span>
          </button>
        </div>
      </div>

      <div class="filter-status" id="filter-status"></div>
      <div class="toolbar">
        <div class="search-wrap">
          <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.35-4.35" />
          </svg>
          <input type="text" id="search" placeholder="Cari tools..." autocomplete="off" />
        </div>
        <button class="view-btn active" id="btn-grid" title="Tampilan grid" onclick="setView('grid')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        </button>
        <button class="view-btn" id="btn-list" title="Tampilan list" onclick="setView('list')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        </button>
        <button class="view-btn" id="btn-fav" title="Favorit saja" onclick="toggleFavFilter()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <span class="badge" style="display:none">0</span>
        </button>
        <button class="view-btn" id="btn-hidden" title="Tool tersembunyi" onclick="toggleHiddenBar()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
          <span class="badge" style="display:none">0</span>
        </button>
      </div>

      <div class="grid" id="grid"></div>
      <div class="empty" id="empty">Tidak ada tool yang cocok ditemukan.</div>

      <script>
        // ── Force scroll to top on load ──
        history.scrollRestoration = "manual";
        window.scrollTo(0, 0);

        // ── Tools (tambah/ubah di sini, mudah) ──
        // href = nama file (relatif ke folder ini)
        // c1   = warna utama (dipakai buat tint background ikon)
        // icon = SVG fungsional per tool, viewBox 0 0 48 48, flat solid multi-warna senada
        const TOOLS = [
          {
            href: "page/Data-Comparer.html",
            title: "Data Comparer",
            desc: "Bandingkan data antar file",
            c1: "#f87171",
            icon: '<rect x="9" y="28" width="8" height="14" rx="2" fill="#dc2626"/><rect x="20" y="20" width="8" height="22" rx="2" fill="#f87171"/><rect x="31" y="10" width="8" height="32" rx="2" fill="#fecaca"/>',
          },
          {
            href: "page/Excel-Compare.html",
            title: "Excel Compare",
            desc: "Bandingkan isi file Excel",
            c1: "#34d399",
            icon: '<rect x="8" y="6" width="32" height="36" rx="4" fill="#d1fae5"/><rect x="12" y="11" width="24" height="3" rx="1" fill="#10b981"/><rect x="12" y="18" width="24" height="3" rx="1" fill="#10b981"/><rect x="12" y="25" width="24" height="3" rx="1" fill="#10b981"/><path fill="#059669" d="M18 38l4 4 8-8-1.6-1.6-6.4 6.4-2.4-2.4z"/>',
          },
          {
            href: "page/Extract-Subjects.html",
            title: "Extract Subjects",
            desc: "Ekstrak daftar mata pelajaran",
            c1: "#fb923c",
            icon: '<path fill="#ea580c" d="M8 14a4 4 0 0 1 4-4h6l3 4h19a4 4 0 0 1 4 4v20a4 4 0 0 1-4 4H12a4 4 0 0 1-4-4z"/><rect x="14" y="27" width="20" height="3" rx="1" fill="#fdba74"/><rect x="14" y="34" width="14" height="3" rx="1" fill="#fdba74"/>',
          },
          {
            href: "page/Fix-Name.html",
            title: "Fix Name",
            desc: "Match & perbaiki nama",
            c1: "#f472b6",
            icon: '<rect x="20" y="9" width="8" height="24" rx="2" fill="#f472b6"/><polygon points="20,33 28,33 24,39" fill="#db2777"/>',
          },
          {
            href: "page/Kalender-Akademik.html",
            title: "Kalender Akademik",
            desc: "Buat jadwal kalender akademik",
            c1: "#60a5fa",
            icon: '<rect x="8" y="10" width="32" height="32" rx="4" fill="#dbeafe"/><rect x="8" y="10" width="32" height="10" rx="4" fill="#60a5fa"/><rect x="12" y="6" width="4" height="7" rx="2" fill="#2563eb"/><rect x="32" y="6" width="4" height="7" rx="2" fill="#2563eb"/><rect x="12" y="26" width="6" height="5" rx="1" fill="#2563eb"/><rect x="21" y="26" width="6" height="5" rx="1" fill="#2563eb"/><rect x="30" y="26" width="6" height="5" rx="1" fill="#2563eb"/><rect x="12" y="35" width="6" height="5" rx="1" fill="#3b82f6"/><rect x="21" y="35" width="6" height="5" rx="1" fill="#3b82f6"/><rect x="30" y="35" width="6" height="5" rx="1" fill="#3b82f6"/>',
          },
          {
            href: "page/Query-Data-Update.html",
            title: "Query Data Update",
            desc: "Query dan update data dengan mudah",
            c1: "#818cf8",
            icon: '<ellipse cx="24" cy="12" rx="14" ry="5" fill="#4f46e5"/><rect x="10" y="12" width="28" height="8" fill="#4f46e5"/><ellipse cx="24" cy="20" rx="14" ry="5" fill="#4f46e5"/><rect x="10" y="20" width="28" height="8" fill="#818cf8"/><ellipse cx="24" cy="28" rx="14" ry="5" fill="#818cf8"/><rect x="10" y="28" width="28" height="8" fill="#a5b4fc"/><ellipse cx="24" cy="36" rx="14" ry="5" fill="#a5b4fc"/>',
          },
          {
            href: "page/School-Notes-&-To-Do.html",
            title: "School Notes & To Do",
            desc: "Catatan sekolah dan daftar tugas",
            c1: "#2dd4bf",
            icon: '<rect x="8" y="8" width="32" height="34" rx="4" fill="#ccfbf1"/><rect x="14" y="4" width="20" height="7" rx="2" fill="#0d9488"/><rect x="12" y="20" width="24" height="3" rx="1" fill="#14b8a6"/><rect x="12" y="27" width="18" height="3" rx="1" fill="#14b8a6"/><path fill="#0d9488" d="M14 38l4 4 8-8-1.6-1.6-6.4 6.4-2.4-2.4z"/>',
          },
          {
            href: "page/Subject-Comparer.html",
            title: "Subject Comparer",
            desc: "Bandingkan mata pelajaran",
            c1: "#c084fc",
            icon: '<path fill="#9333ea" d="M10 12l16-6v28l-16 6z"/><path fill="#c084fc" d="M38 12l-12-4v28l12 4z"/><path fill="#d8b4fe" d="M10 12l10-4v28l-10 4z"/>',
          },
          {
            href: "page/Username-Maker.html",
            title: "Username Maker",
            desc: "Generate username dari nama",
            c1: "#22d3ee",
            icon: '<rect x="8" y="6" width="32" height="36" rx="6" fill="#cffafe"/><circle cx="24" cy="20" r="7" fill="#22d3ee"/><path fill="#0891b2" d="M14 40c0-5.5 4.5-10 10-10s10 4.5 10 10"/><rect x="30" y="12" width="3" height="7" rx="1" fill="#67e8f9"/><rect x="30" y="23" width="3" height="4" rx="1" fill="#67e8f9"/>',
          },
          {
            href: "page/Variable-Python.html",
            title: "Variable Python",
            desc: "Analisis variabel dari file .py",
            c1: "#60a5fa",
            icon: '<rect x="8" y="6" width="32" height="36" rx="4" fill="#dbeafe"/><text x="24" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb" font-family="monospace">py</text><rect x="12" y="28" width="10" height="3" rx="1" fill="#3b82f6"/><rect x="12" y="34" width="16" height="3" rx="1" fill="#93c5fd"/><rect x="26" y="28" width="8" height="3" rx="1" fill="#93c5fd"/>',
          },
          {
            href: "page/HTML-Report-Inspector.html",
            title: "HTML Report Inspector",
            desc: "Inspeksi dan hover-preview kode HTML rapor",
            c1: "#f472b6",
            icon: '<rect x="8" y="6" width="32" height="36" rx="4" fill="#fce7f3"/><text x="24" y="22" text-anchor="middle" font-size="9" font-weight="700" fill="#db2777" font-family="monospace">&lt;/&gt;</text><rect x="12" y="28" width="24" height="3" rx="1" fill="#f472b6"/><rect x="12" y="34" width="16" height="3" rx="1" fill="#f9a8d4"/>',
          },
          {
            href: "page/OCR.html",
            title: "OCR",
            desc: "Ekstrak teks dari gambar (Tesseract.js)",
            c1: "#38bdf8",
            icon: '<rect x="8" y="8" width="32" height="32" rx="4" fill="#e0f2fe"/><circle cx="24" cy="22" r="8" fill="none" stroke="#0284c7" stroke-width="2.5"/><circle cx="24" cy="22" r="3" fill="#0284c7"/><rect x="14" y="6" width="6" height="4" rx="1" fill="#38bdf8"/><rect x="28" y="6" width="6" height="4" rx="1" fill="#38bdf8"/><rect x="10" y="36" width="28" height="3" rx="1.5" fill="#7dd3fc"/>',
          },
          {
            href: "page/Document-Scanner.html",
            title: "Document Scanner",
            desc: "Auto-crop & perjelas teks dokumen (OpenCV.js)",
            c1: "#34d399",
            icon: '<rect x="9" y="6" width="30" height="36" rx="3" fill="#d1fae5"/><rect x="13" y="10" width="22" height="28" rx="1" fill="#34d399"/><path d="M30 6l8-2-2 8z" fill="#059669"/><rect x="16" y="15" width="16" height="2.5" rx="1" fill="#065f46"/><rect x="16" y="21" width="16" height="2.5" rx="1" fill="#065f46"/><rect x="16" y="27" width="11" height="2.5" rx="1" fill="#065f46"/>',
          },
        ];

        const grid = document.getElementById("grid");
        const search = document.getElementById("search");
        const empty = document.getElementById("empty");
        const btnFav = document.getElementById("btn-fav");

        // ── Favorit (localStorage) ──
        function getFavs() {
          try {
            return JSON.parse(localStorage.getItem("tools-fav") || "[]");
          } catch {
            return [];
          }
        }
        function saveFavs(favs) {
          localStorage.setItem("tools-fav", JSON.stringify(favs));
        }
        function isFav(title) {
          return getFavs().includes(title);
        }

        // ── Hide (localStorage) ──
        function getHidden() {
          try {
            return JSON.parse(localStorage.getItem("tools-hidden") || "[]");
          } catch {
            return [];
          }
        }
        function saveHidden(arr) {
          localStorage.setItem("tools-hidden", JSON.stringify(arr));
          window.dispatchEvent(new CustomEvent("tools-hidden-change"));
        }
        function isHidden(title) {
          return getHidden().includes(title);
        }
        function toggleHidden(title) {
          let h = getHidden();
          h = h.includes(title) ? h.filter((x) => x !== title) : [...h, title];
          saveHidden(h);
          render();
        }

        // ── Render ──
        function render() {
          const q = search.value.toLowerCase().trim();
          const favOnly = btnFav.classList.contains("active");
          const hidden = getHidden();
          let list = TOOLS.filter((t) => {
            if (hiddenOnly) return isHidden(t.title);
            if (favOnly) return isFav(t.title);
            if (q) return (t.title + " " + t.desc).toLowerCase().includes(q);
            return !isHidden(t.title);
          });
          // favorit dulu (abjad), baru sisanya (abjad)
          list.sort((a, b) => Number(isFav(b.title)) - Number(isFav(a.title)) || a.title.localeCompare(b.title, "id"));
          let visible = 0;
          grid.innerHTML = list
            .map((t) => {
              visible++;
              const fav = isFav(t.title);
              const hideBtn = hiddenOnly
                ? `<button class="hide-btn show-btn" title="Tampilkan" aria-label="Tampilkan ${t.title}" onclick="event.preventDefault(); toggleHidden('${t.title.replace(/'/g, "\\'")}');">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
                  </button>`
                : `<button class="hide-btn" title="Sembunyikan" aria-label="Sembunyikan ${t.title}" onclick="event.preventDefault(); toggleHidden('${t.title.replace(/'/g, "\\'")}');">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
                  </button>`;
              return `
      <a class="tool-card" style="animation-delay:${Math.min(visible - 1, 8) * 40}ms;--icon-bg:${t.c1}" href="${t.href}">
        <button class="fav-btn${fav ? " fav" : ""}" title="${fav ? "Hapus dari favorit" : "Tambah ke favorit"}" aria-label="Favorit ${t.title}" onclick="event.preventDefault(); toggleFav('${t.title.replace(/'/g, "\\'")}');">
          <i class="fad fa-star"></i>
        </button>
        ${hideBtn}
        <div class="tool-icon"><svg viewBox="0 0 48 48">${t.icon}</svg></div>
        <div class="tool-text"><h3>${t.title}</h3><p>${t.desc}</p></div>
      </a>`;
            })
            .join("");
          empty.classList.toggle("show", visible === 0);
          updateToolbarBadges();
        }

        function toggleFav(title) {
          let favs = getFavs();
          favs = favs.includes(title) ? favs.filter((x) => x !== title) : [...favs, title];
          saveFavs(favs);
          render();
        }

        function toggleFavFilter() {
          const on = !btnFav.classList.contains("active");
          btnFav.classList.toggle("active", on);
          if (on) {
            hiddenOnly = false;
            btnHidden.classList.remove("active");
          }
          render();
        }

        // ── Hidden bar toggle (toolbar) ──
        const btnHidden = document.getElementById("btn-hidden");
        function updateToolbarBadges() {
          const hn = getHidden().length;
          const fn = getFavs().length;
          const hb = btnHidden.querySelector(".badge");
          const fb = btnFav.querySelector(".badge");
          hb.textContent = hn;
          hb.style.display = hn > 0 ? "" : "none";
          fb.textContent = fn;
          fb.style.display = fn > 0 ? "" : "none";
          btnHidden.classList.toggle("active", hiddenOnly);
          const fs = document.getElementById("filter-status");
          if (hiddenOnly) fs.textContent = "Filter aktif: Tool tersembunyi";
          else if (btnFav.classList.contains("active")) fs.textContent = "Filter aktif: Favorit";
          else if (search.value.trim()) fs.textContent = "Filter aktif: Pencarian";
          else fs.textContent = "";
        }
        function toggleHiddenBar() {
          hiddenOnly = !hiddenOnly;
          if (hiddenOnly) btnFav.classList.remove("active");
          render();
        }
        let hiddenOnly = false;

        search.addEventListener("input", render);


        // ── View toggle ──
        const btnGrid = document.getElementById("btn-grid");
        const btnList = document.getElementById("btn-list");

        function setView(v) {
          grid.classList.toggle("list-view", v === "list");
          btnGrid.classList.toggle("active", v === "grid");
          btnList.classList.toggle("active", v === "list");
          localStorage.setItem("view", v);
        }

        render();
        updateToolbarBadges();

        (function () {
          const saved = localStorage.getItem("view");
          if (saved === "list") setView("list");
        })();

        // ── Theme toggle ──
        (function () {
          const root = document.documentElement;
          const toggle = document.getElementById("theme-toggle");
          const label = document.getElementById("theme-label");
          const sun = toggle.querySelector(".icon-sun");
          const moon = toggle.querySelector(".icon-moon");

          function applyTheme(t) {
            root.setAttribute("data-theme", t);
            localStorage.setItem("theme", t);
            if (t === "dark") {
              sun.style.display = "none";
              moon.style.display = "";
              label.textContent = "Mode Terang";
            } else {
              sun.style.display = "";
              moon.style.display = "none";
              label.textContent = "Mode Gelap";
            }
          }

          applyTheme(localStorage.getItem("theme") || "dark");

          window.toggleTheme = function () {
            toggle.classList.add("is-switching");
            setTimeout(() => toggle.classList.remove("is-switching"), 400);
            const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
            if (window.triggerThemeSplash) window.triggerThemeSplash(toggle, next, applyTheme);
            else applyTheme(next);
          };

          toggle.addEventListener("click", window.toggleTheme);
        })();
      </script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Service Worker registered:', reg.scope))
            .catch(err => console.log('Service Worker registration failed:', err));
        });
      }
    </script>
  </div>
    <script src="theme-splash.js"></script>
    <script src="navbar.js"></script>
</body>
</html>
