<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="shared.css" />
    <link rel="preload" href="../fontawesome/webfonts/fa-regular-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="../fontawesome/webfonts/fa-solid-900.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="../fontawesome/webfonts/fa-duotone-900.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="../fontawesome/css/fontawesome.css" />
    <link rel="stylesheet" href="../fontawesome/css/duotone.css" />
    <link rel="stylesheet" href="../fontawesome/css/regular.css" />
    <title>My List</title>
    <link rel="icon" type="image/svg+xml" href="../icon.svg" />
    <style>
      :root {
        --accent: #e50914; --accent-2: #b81f25; --border: #2a2a2a;
        --card-bg: #181818; --card-bg-2: #242424; --text: #f5f5f5;
        --muted: #9a9a9a; --hover-bg: rgba(255,255,255,0.07); --bg: #0b0b0b;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --accent: #d40914; --accent-2: #a01218; --border: #ddd;
          --card-bg: #fff; --card-bg-2: #f2f2f2; --text: #1a1a1a;
          --muted: #666; --hover-bg: rgba(0,0,0,0.05); --bg: #f5f5f5;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body { background: var(--bg); color: var(--text); font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; padding: 24px; }

      .page-header { max-width: 1100px; margin: 0 auto 20px; padding-top: 60px; }
      .page-header h1 { margin: 0 0 16px; font-size: 1.5rem; font-weight: 800; }

      .tabs { display: flex; gap: 6px; margin-bottom: 20px; }
      .tab {
        padding: 7px 18px; border-radius: 16px; border: 1px solid var(--border);
        background: transparent; color: var(--muted); font-size: 0.82rem; font-weight: 600;
        cursor: pointer; transition: all 0.18s;
      }
      .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
      .tab:hover:not(.active) { border-color: var(--accent); color: var(--text); }
      .tab .badge { margin-left: 6px; background: rgba(255,255,255,0.15); padding: 1px 7px; border-radius: 10px; font-size: 0.7rem; }
      .tab.active .badge { background: rgba(255,255,255,0.25); }

      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; max-width: 1100px; margin: 0 auto; }
      .card {
        cursor: pointer; background: var(--card-bg); border-radius: 8px;
        overflow: hidden; transition: transform 0.2s, box-shadow 0.2s;
      }
      .card:hover { transform: scale(1.05); z-index: 5; box-shadow: 0 8px 28px rgba(0,0,0,0.6); }
      .card .poster { aspect-ratio: 2/3; background: var(--card-bg-2); position: relative; overflow: hidden; }
      .card .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .card .poster .ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--border); font-size: 1.6rem; }
      .card .poster .rating { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,0.78); color: #ffd54f; font-size: 0.7rem; font-weight: 700; padding: 2px 7px; border-radius: 6px; }
      .card .poster .type-badge { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.78); color: var(--muted); font-size: 0.65rem; font-weight: 600; padding: 2px 7px; border-radius: 6px; }
      .card .info { padding: 8px 10px 10px; }
      .card .title { font-size: 0.82rem; font-weight: 600; line-height: 1.25; margin: 0 0 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .card .year { font-size: 0.72rem; color: var(--muted); }

      .empty { text-align: center; padding: 80px 24px; color: var(--muted); }
      .empty i { font-size: 2.5rem; margin-bottom: 12px; display: block; }

      @media (max-width: 640px) { .grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); } }
      @media (min-width: 1049px) { body:has(#navbar) { padding-left: 244px; } }
    </style>
  </head>
  <body>
    <div id="navbar"></div>
    <script src="settings.js"></script>
    <script src="../navbar.js"></script>

    <div class="page-header">
      <h1><i class="fa-solid fa-bookmark" style="color:var(--accent)"></i> My List</h1>
      <div class="tabs">
        <button class="tab active" id="tab-watchlist" onclick="switchTab('watchlist')">
          <i class="fa-solid fa-bookmark"></i> Watchlist <span class="badge" id="badge-watchlist">0</span>
        </button>
        <button class="tab" id="tab-completed" onclick="switchTab('completed')">
          <i class="fa-solid fa-circle-check"></i> Selesai <span class="badge" id="badge-completed">0</span>
        </button>
      </div>
    </div>

    <div class="grid" id="list-grid"></div>
    <div class="empty" id="list-empty" style="display:none">
      <i class="fa-solid fa-bookmark"></i>
      <div>Belum ada film di list ini.</div>
      <div style="font-size:0.8rem;margin-top:6px">Klik ikon bookmark/check di Torrent Search untuk menambah.</div>
    </div>

    <div id="detail-modal" class="detail-modal">
      <div class="detail-box">
        <div class="detail-backdrop" id="detail-backdrop">
          <button class="detail-close" onclick="closeDetail()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="detail-body" id="detail-body"></div>
      </div>
    </div>

    <style>
      .detail-modal { position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.8); display: none; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 40px 16px; }
      .detail-modal.open { display: flex; }
      .detail-box { background: var(--card-bg); border-radius: 12px; overflow: hidden; width: 100%; max-width: 820px; box-shadow: 0 12px 50px rgba(0,0,0,0.7); animation: fadeIn 0.24s ease-out; max-height: 90vh; overflow-y: auto; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
      .detail-backdrop { position: relative; aspect-ratio: 16/9; background-size: cover; background-position: center; }
      .detail-backdrop::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 40%, var(--card-bg) 100%); }
      .detail-close { position: absolute; top: 12px; right: 12px; z-index: 3; background: rgba(0,0,0,0.6); border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; }
      .detail-close:hover { background: rgba(0,0,0,0.85); }
      .detail-body { padding: 0 28px 28px; margin-top: -60px; position: relative; z-index: 2; }
      .detail-body h2 { margin: 0 0 8px; font-size: 1.6rem; font-weight: 800; }
      .detail-meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.82rem; color: var(--muted); margin-bottom: 12px; }
      .detail-meta .rating { color: #ffd54f; font-weight: 700; }
      .detail-meta .badge { background: var(--card-bg-2); padding: 2px 8px; border-radius: 4px; }
      .detail-overview { font-size: 0.88rem; line-height: 1.5; color: #d4d4d4; margin: 0 0 20px; }
      :root[data-theme="light"] .detail-overview { color: #444; }
      .detail-actions { display: flex; gap: 10px; flex-wrap: wrap; }
      .btn-find { display: inline-flex; align-items: center; gap: 8px; padding: 11px 26px; border: none; border-radius: 5px; background: var(--accent); color: #fff; font-size: 0.92rem; font-weight: 700; cursor: pointer; transition: opacity 0.18s; }
      .btn-find:hover { opacity: 0.85; }
      .btn-find.ghost { background: rgba(255,255,255,0.18); color: #fff; }
      .detail-loading { padding: 80px 0; text-align: center; color: var(--muted); }
    </style>

    <script>
    const API = location.origin + '/api';
    let currentTab = 'watchlist';

    async function init() {
      await Settings.init();
      renderList();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tab-watchlist').classList.toggle('active', tab === 'watchlist');
      document.getElementById('tab-completed').classList.toggle('active', tab === 'completed');
      renderList();
    }

    function renderList() {
      const items = Settings.get(currentTab, []);
      const grid = document.getElementById('list-grid');
      const empty = document.getElementById('list-empty');
      document.getElementById('badge-watchlist').textContent = (Settings.get('watchlist', [])).length;
      document.getElementById('badge-completed').textContent = (Settings.get('completed', [])).length;

      if (!items.length) {
        grid.innerHTML = '';
        empty.style.display = '';
        empty.querySelector('i').className = currentTab === 'watchlist' ? 'fa-solid fa-bookmark' : 'fa-solid fa-circle-check';
        empty.querySelector('div').textContent = currentTab === 'watchlist' ? 'Belum ada film di watchlist.' : 'Belum ada film yang selesai ditonton.';
        return;
      }
      empty.style.display = 'none';
      grid.innerHTML = '';
      items.forEach((m) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="poster">
            ${m.poster_url
              ? `<img src="${m.poster_url}" alt="${esc(m.title)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentElement.innerHTML='<div class=\\'ph\\'><i class=\\'fa-solid fa-film\\'></i></div>'">`
              : '<div class="ph"><i class="fa-solid fa-film"></i></div>'}
            <div class="type-badge">${m.type === 'tv' ? 'TV' : 'Movie'}</div>
          </div>
          <div class="info">
            <div class="title">${esc(m.title || 'Unknown')}</div>
            <div class="year">${m.year || ''}</div>
          </div>`;
        card.onclick = () => openDetail(m);
        grid.appendChild(card);
      });
    }

    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    // ── Detail modal (reuse from Torrent-Search) ──
    async function openDetail(movie) {
      const modal = document.getElementById('detail-modal');
      const backdrop = document.getElementById('detail-backdrop');
      const body = document.getElementById('detail-body');
      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
      backdrop.style.backgroundImage = 'none';
      body.innerHTML = '<div class="detail-loading"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</div>';

      const type = movie.type || 'movie';
      const id = movie.id;
      try {
        const r = await fetch(`${API}/tmdb?path=${encodeURIComponent('/' + type + '/' + id)}&append_to_response=${encodeURIComponent('credits,external_ids')}`);
        const d = await r.json();
        if (d.error) throw new Error(d.error);
        const fBd = d.backdrop_url || (d.backdrop_path ? 'https://image.tmdb.org/t/p/w1280' + d.backdrop_path : '');
        if (fBd) backdrop.style.backgroundImage = `url("${fBd}")`;
        const title = type === 'tv' ? (d.name || d.original_name) : (d.title || d.original_title);
        const year = (d.release_date || d.first_air_date || '').slice(0, 4);
        const genres = (d.genres || []).map(g => g.name).join(', ');
        const runtime = d.runtime ? (d.runtime + ' min') : ((d.episode_run_time || [])[0] ? (d.episode_run_time[0] + ' min') : '');
        body.innerHTML = `
          <h2>${esc(title || 'Unknown')}</h2>
          <div class="detail-meta">
            ${d.vote_average ? `<span class="rating">${d.vote_average.toFixed(1)}</span>` : ''}
            ${year ? `<span>${year}</span>` : ''}
            ${runtime ? `<span>${runtime}</span>` : ''}
            ${genres ? `<span class="badge">${esc(genres)}</span>` : ''}
            <span class="badge">${type === 'tv' ? 'TV' : 'Movie'}</span>
          </div>
          <p class="detail-overview">${esc(d.overview || 'No description available.')}</p>
          <div class="detail-actions">
            <a class="btn-find" href="Torrent-Search.html?q=${encodeURIComponent(title)}" style="text-decoration:none"><i class="fa-solid fa-magnifying-glass"></i> Cari Torrent</a>
            <button class="btn-find ghost" onclick="closeDetail()"><i class="fa-solid fa-xmark"></i> Tutup</button>
          </div>`;
      } catch (e) {
        body.innerHTML = `<div class="detail-loading">Gagal memuat detail: ${esc(e.message)}</div>`;
      }
    }

    function closeDetail() {
      document.getElementById('detail-modal').classList.remove('open');
      document.body.style.overflow = '';
    }
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDetail(); });
    document.getElementById('detail-modal').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeDetail(); });

    init();
    </script>
  </body>
</html>
